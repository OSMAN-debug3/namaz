<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaz & Roza Tracker</title>
    <style>
        :root {
            --primary: #047857;
            --primary-dark: #065f46;
            --primary-light: #ecfdf5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
        }

        header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            background: var(--bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            color: var(--text);
            outline: none;
            transition: 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }

        .user-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-light);
            border: 1px solid #a7f3d0;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
        }

        .user-banner .greeting {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .user-banner .sub {
            font-size: 12px;
            color: var(--primary);
        }

        .logout-btn {
            background: #fff;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .namaz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .namaz-card {
            background: var(--bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .namaz-card label {
            margin-bottom: 4px;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
            margin-bottom: 14px;
            font-size: 14px;
            padding: 10px;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .hidden {
            display: none;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🕌 Ghar Ka Namaz Tracker</h1>
            <p>Namaz, Roza, Quran aur Tarawih Tracker</p>
        </header>

        <!-- 1. LOGIN / REGISTER CARD -->
        <div class="card" id="authCard">
            <div class="tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">🔑 Login Karein</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">✨ Nayi ID Banayein</button>
            </div>

            <h2 id="authTitle">Apni ID Mein Login Karein</h2>

            <div class="form-group">
                <label>Aapka Naam (ID)</label>
                <input type="text" id="authName" placeholder="Jaise: Abbu, Ammi, Osman">
            </div>

            <div class="form-group">
                <label>Password (PIN)</label>
                <input type="password" id="authPass" placeholder="Apna secret password dalein">
            </div>

            <button class="btn" id="authBtn" onclick="handleAuth()">Login Karein</button>
            <p class="help-text" id="authHelp">Pehli baar aaye hain? Upar "Nayi ID Banayein" par click karein.</p>
        </div>

        <!-- 2. REPORT CARD -->
        <div class="card hidden" id="trackerCard">
            <div class="user-banner">
                <div>
                    <div class="greeting" id="welcomeUser">Assalamu Alaikum!</div>
                    <div class="sub">Aapki ID login hai</div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout / Badlein</button>
            </div>

            <h2>📝 Aaj Ki Ibadat Report</h2>

            <div class="form-group">
                <label>Tarik (Date)</label>
                <input type="date" id="reportDate" onchange="checkDay()">
            </div>

            <button class="btn btn-secondary" onclick="markAll()">✨ Alhumdulillah! Sabhi Namazein Ada Ho Gayi</button>

            <div class="namaz-grid">
                <div class="namaz-card">
                    <label>Fajr</label>
                    <select id="fajr">
                        <option value="Nahi">❌ Nahi</option>
                        <option value="Ada">✅ Ada</option>
                        <option value="Qaza">🕒 Qaza</option>
                    </select>
                </div>
                <div class="namaz-card">
                    <label id="zuhrLabel">Zuhr</label>
                    <select id="zuhr">
                        <option value="Nahi">❌ Nahi</option>
                        <option value="Ada">✅ Ada</option>
                        <option value="Qaza">🕒 Qaza</option>
                    </select>
                </div>
                <div class="namaz-card">
                    <label>Asr</label>
                    <select id="asr">
                        <option value="Nahi">❌ Nahi</option>
                        <option value="Ada">✅ Ada</option>
                        <option value="Qaza">🕒 Qaza</option>
                    </select>
                </div>
                <div class="namaz-card">
                    <label>Maghrib</label>
                    <select id="maghrib">
                        <option value="Nahi">❌ Nahi</option>
                        <option value="Ada">✅ Ada</option>
                        <option value="Qaza">🕒 Qaza</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Isha</label>
                <select id="isha">
                    <option value="Nahi">❌ Nahi</option>
                    <option value="Ada">✅ Ada</option>
                    <option value="Qaza">🕒 Qaza</option>
                </select>
            </div>

            <div class="form-group">
                <label>Roza</label>
                <select id="roza">
                    <option value="Nahi">Nahi</option>
                    <option value="Rakha">🌙 Alhumdulillah Rakha</option>
                </select>
            </div>

            <div class="form-group">
                <label>📖 Quran Tilawat</label>
                <select id="quran">
                    <option value="Nahi">Nahi Padha</option>
                    <option value="1-2 Pages">1 - 2 Pages</option>
                    <option value="1 Para">1 Para</option>
                    <option value="2 Paras">2 Paras</option>
                </select>
            </div>

            <div class="form-group">
                <label>🌙 Tarawih</label>
                <select id="tarawih">
                    <option value="Nahi">❌ Nahi</option>
                    <option value="Ada">✅ Ada</option>
                </select>
            </div>

            <button class="btn" id="submitBtn" onclick="saveReport()">💾 Google Sheet Par Save Karein</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgehjHDIKHj1SFnRnodQWFk90Ts7PfMg7wTgcoyB0qhSM_9c2LPVA1Bm7sfwmuF81oAg/exec';
        let currentMode = 'login';

        document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
        checkDay();

        // Date badalne par check karein ki kya Friday (Jumma) hai
        function checkDay() {
            const dateVal = document.getElementById('reportDate').value;
            const dateObj = new Date(dateVal);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[dateObj.getDay()];

            const zuhrLabel = document.getElementById('zuhrLabel');
            if (dayName === 'Friday') {
                zuhrLabel.innerText = 'Jumma 🕌';
            } else {
                zuhrLabel.innerText = 'Zuhr';
            }
        }

        window.onload = function() {
            const savedName = localStorage.getItem('namaz_user');
            const savedPass = localStorage.getItem('namaz_pass');
            if (savedName && savedPass) {
                showTracker(savedName);
            }
        };

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('registerTab').classList.toggle('active', mode === 'register');

            if (mode === 'login') {
                document.getElementById('authTitle').innerText = 'Apni ID Mein Login Karein';
                document.getElementById('authBtn').innerText = 'Login Karein';
                document.getElementById('authHelp').innerText = 'Pehli baar aaye hain? Upar "Nayi ID Banayein" par click karein.';
            } else {
                document.getElementById('authTitle').innerText = 'Apni Nayi ID Banayein';
                document.getElementById('authBtn').innerText = 'ID Banayein (Register)';
                document.getElementById('authHelp').innerText = 'Apna naam aur ek asan password chunein jo aapko yaad rahe.';
            }
        }

        async function handleAuth() {
            const name = document.getElementById('authName').value.trim();
            const password = document.getElementById('authPass').value.trim();

            if (!name || !password) {
                alert('Kripya apna Naam aur Password dono likhein!');
                return;
            }

            const btn = document.getElementById('authBtn');
            const oldText = btn.innerText;
            btn.innerText = 'Intezar karein...';
            btn.disabled = true;

            try {
                const url = `${SCRIPT_URL}?action=${currentMode}&name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.result === 'success') {
                    const finalName = data.name || name;
                    localStorage.setItem('namaz_user', finalName);
                    localStorage.setItem('namaz_pass', password);
                    alert(data.message);
                    showTracker(finalName);
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                console.error(error);
                alert('Connection mein kuch dikkat aayi. Kripya dobara koshish karein.');
            } finally {
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }

        function showTracker(name) {
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('trackerCard').classList.remove('hidden');
            document.getElementById('welcomeUser').innerText = 'Assalamu Alaikum, ' + name + '!';
        }

        function logout() {
            localStorage.removeItem('namaz_user');
            localStorage.removeItem('namaz_pass');
            document.getElementById('authName').value = '';
            document.getElementById('authPass').value = '';
            document.getElementById('trackerCard').classList.add('hidden');
            document.getElementById('authCard').classList.remove('hidden');
        }

        function markAll() {
            document.getElementById('fajr').value = 'Ada';
            document.getElementById('zuhr').value = 'Ada';
            document.getElementById('asr').value = 'Ada';
            document.getElementById('maghrib').value = 'Ada';
            document.getElementById('isha').value = 'Ada';
        }

        async function saveReport() {
            const name = localStorage.getItem('namaz_user');
            const password = localStorage.getItem('namaz_pass');
            const date = document.getElementById('reportDate').value;

            if (!name || !password) {
                alert('Kripya pehle login karein!');
                logout();
                return;
            }

            const dateObj = new Date(date);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[dateObj.getDay()];

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const params = new URLSearchParams({
                action: 'save',
                name: name,
                password: password,
                date: date,
                day: dayName,
                fajr: document.getElementById('fajr').value,
                zuhr: document.getElementById('zuhr').value,
                asr: document.getElementById('asr').value,
                maghrib: document.getElementById('maghrib').value,
                isha: document.getElementById('isha').value,
                roza: document.getElementById('roza').value,
                quran: document.getElementById('quran').value,
                tarawih: document.getElementById('tarawih').value
            });

            try {
                const response = await fetch(`${SCRIPT_URL}?${params.toString()}`);
                const data = await response.json();

                if (data.result === 'success') {
                    alert('✅ MashaAllah! ' + data.message);
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                console.error(error);
                alert('MashaAllah! Report save ho gayi!');
            } finally {
                btn.innerText = '💾 Google Sheet Par Save Karein';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
