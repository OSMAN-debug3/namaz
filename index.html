<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mizan | Islamic Ibadat Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #021a13;
            --bg-emerald: #062f23;
            --card-bg: rgba(8, 53, 40, 0.78);
            --card-inner: rgba(4, 33, 24, 0.85);
            --gold: #d4af37;
            --gold-light: #fbe69b;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --emerald-bright: #10b981;
            --amber: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-gold: rgba(212, 175, 55, 0.28);
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, #0b4f3a 0%, transparent 65%),
                radial-gradient(circle at 85% 85%, #063829 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.02) 0px, rgba(212, 175, 55, 0.02) 2px, transparent 2px, transparent 12px);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px 40px;
            line-height: 1.5;
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 18px 15px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.1) 0%, rgba(6, 47, 35, 0.4) 100%);
            border: 1px solid var(--border-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: var(--gold-light);
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 2px 12px rgba(212, 175, 55, 0.4);
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .ayah-box {
            font-size: 12.5px;
            color: #cbd5e1;
            font-style: italic;
            max-width: 90%;
            margin: 0 auto;
            padding-top: 6px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-gold);
        }

        .card h2 {
            font-size: 17px;
            color: var(--gold-light);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            background: var(--card-inner);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border-subtle);
        }

        .tab-btn {
            flex: 1;
            padding: 11px;
            border: none;
            background: transparent;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--gold), #b48a1e);
            color: #021a13;
            box-shadow: 0 4px 12px var(--gold-glow);
        }

        .user-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(212, 175, 55, 0.1));
            border: 1px solid var(--border-gold);
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .user-banner .greeting {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .user-banner .sub {
            font-size: 12px;
            color: #a7f3d0;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .progress-container {
            background: var(--card-inner);
            border: 1px solid var(--border-subtle);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gold-light);
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, var(--gold));
            border-radius: 99px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-subtle);
            border-radius: 11px;
            font-size: 14.5px;
            font-weight: 500;
            background: #042118;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
            color-scheme: dark;
        }

        select optgroup {
            background: #021a13;
            color: var(--gold-light);
            font-weight: 700;
        }

        select option {
            background: #042118;
            color: var(--text-main);
            padding: 8px;
        }

        select:focus, input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .namaz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .namaz-card {
            background: var(--card-inner);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            transition: all 0.25s ease;
        }

        .namaz-card.full-width {
            grid-column: span 2;
        }

        .namaz-card.status-ada {
            border-color: var(--emerald-bright);
            background: rgba(16, 185, 129, 0.12);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15);
        }

        .namaz-card.status-qaza {
            border-color: var(--amber);
            background: rgba(245, 158, 11, 0.12);
        }

        .namaz-card label {
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--gold-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .extra-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold), #b48a1e);
            color: #021a13;
            border: none;
            border-radius: 12px;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px var(--gold-glow);
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(16, 185, 129, 0.15);
            color: #a7f3d0;
            border: 1px solid rgba(16, 185, 129, 0.35);
            box-shadow: none;
            margin-bottom: 16px;
            font-size: 13.5px;
            padding: 11px;
        }

        .hidden {
            display: none;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="bismillah">﷽</div>
            <h1>🕌 Al-Mizan Ibadat Tracker</h1>
            <div class="ayah-box">
                "Beshak Namaz behayai aur bure kaamo se rokti hai." (Al-Quran 29:45)
            </div>
        </header>

        <!-- 1. LOGIN / REGISTER CARD -->
        <div class="card" id="authCard">
            <div class="tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">🔑 Login Karein</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">✨ Nayi ID Banayein</button>
            </div>

            <h2 id="authTitle">Apni ID Mein Login Karein</h2>

            <div class="form-group">
                <label>Aapka Naam (ID)</label>
                <input type="text" id="authName" placeholder="Jaise: Abbu, Ammi, Osman">
            </div>

            <div class="form-group">
                <label>Secret Password (PIN)</label>
                <input type="password" id="authPass" placeholder="Apna secret password dalein">
            </div>

            <button class="btn" id="authBtn" onclick="handleAuth()">Login Karein</button>
            <p class="help-text" id="authHelp">Pehli baar aaye hain? Upar "Nayi ID Banayein" par click karein.</p>
        </div>

        <!-- 2. IBADAT REPORT CARD -->
        <div class="card hidden" id="trackerCard">
            <div class="user-banner">
                <div>
                    <div class="greeting" id="welcomeUser">Assalamu Alaikum!</div>
                    <div class="sub">✨ Aaj ki nekia darj karein</div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- LIVE IBADAT FOCUS METER -->
            <div class="progress-container">
                <div class="progress-header">
